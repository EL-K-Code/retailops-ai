retailops_ai:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GOOGLE_CLOUD_PROJECT') }}"
      dataset: "{{ env_var('BQ_DBT_DATASET', 'retailops') }}"
      location: "{{ env_var('BQ_LOCATION', 'us-central1') }}"
      threads: 4
      priority: interactive
