name: Deploy RetailOps Platform

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: retailops-platform-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  AGENT_SERVICE: retailops-agent
  FORECAST_SERVICE: retailops-api
  AGENT_IMAGE_NAME: retailops-agent
  FORECAST_IMAGE_NAME: retailops-api

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve deployment commit
        id: revision
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "${GITHUB_OUTPUT}"
          else
            echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push immutable platform images
        shell: bash
        run: |
          set -euo pipefail

          AGENT_IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${AGENT_IMAGE_NAME}:${{ steps.revision.outputs.sha }}"
          FORECAST_IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${FORECAST_IMAGE_NAME}:${{ steps.revision.outputs.sha }}"

          build_and_wait() {
            local config="$1"
            local image_uri="$2"
            local label="$3"

            local build_id
            build_id="$(gcloud builds submit \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --config="${config}" \
              --substitutions="_IMAGE_URI=${image_uri}" \
              --async \
              --format='value(id)' \
              .)"

            if [[ -z "${build_id}" ]]; then
              echo "${label}: Cloud Build did not return a build ID."
              exit 1
            fi

            echo "${label} Cloud Build ID: ${build_id}"
            while true; do
              local status
              status="$(gcloud builds describe "${build_id}" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --format='value(status)')"
              echo "${label} Cloud Build status: ${status}"

              case "${status}" in
                SUCCESS)
                  break
                  ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                  echo "${label} Cloud Build failed with status: ${status}"
                  exit 1
                  ;;
                *)
                  sleep 10
                  ;;
              esac
            done
          }

          build_and_wait "api/cloudbuild.yaml" "${FORECAST_IMAGE_URI}" "Forecast API"
          build_and_wait "agent_api/cloudbuild-console.yaml" "${AGENT_IMAGE_URI}" "Agent Console"

          echo "FORECAST_IMAGE_URI=${FORECAST_IMAGE_URI}" >> "${GITHUB_ENV}"
          echo "AGENT_IMAGE_URI=${AGENT_IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Roll out forecast API image
        shell: bash
        run: |
          gcloud run services update "${FORECAST_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${FORECAST_IMAGE_URI}" \
            --quiet

      - name: Roll out agent console image
        shell: bash
        run: |
          gcloud run services update "${AGENT_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${AGENT_IMAGE_URI}" \
            --quiet

      - name: Verify platform rollout
        shell: bash
        run: |
          echo "Forecast API"
          gcloud run services describe "${FORECAST_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='table(status.latestReadyRevisionName,status.traffic[0].percent,status.url)'

          echo "Agent Console"
          gcloud run services describe "${AGENT_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='table(status.latestReadyRevisionName,status.traffic[0].percent,status.url)'

      - name: Smoke test private forecast service
        shell: bash
        run: |
          set -euo pipefail

          FORECAST_URL="$(gcloud run services describe "${FORECAST_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"

          TOKEN="$(gcloud auth print-identity-token --audiences="${FORECAST_URL}")"

          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${TOKEN}" \
            "${FORECAST_URL}/readyz"

          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -H "x-request-id: cd-smoke-${{ steps.revision.outputs.sha }}" \
            -X POST \
            -d '{"entities":[{"item_id":"FOODS_1_001","store_id":"CA_1"}],"split":"test"}' \
            "${FORECAST_URL}/v1/forecast" \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["forecasts"])==1; assert len(d["forecasts"][0]["points"])==28; print("Forecast smoke OK:", d["request_id"])'

      - name: Report IAP-protected agent smoke boundary
        shell: bash
        run: |
          echo "Agent rollout is verified at Cloud Run revision/traffic level above."
          echo "The browser console is protected by IAP, so HTTP smoke testing requires"
          echo "an IAP OAuth audience and an IAP-authorized test principal."
          echo "Do not bypass IAP in CI merely to make the smoke test easier."
