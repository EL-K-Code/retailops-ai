[project]
name = "retailops-ai"
version = "0.1.0"
description = "End-to-end Data, ML and Agentic AI platform for retail operations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "db-dtypes>=1.7.1,<2",
    "dbt-bigquery>=1.12,<2",
    "google-cloud-aiplatform>=1.74,<3",
    "google-cloud-bigquery>=3.45,<4",
    "google-cloud-bigquery-storage>=2.41,<3",
    "google-cloud-storage>=3.1.1,<3.2",
    "lightgbm>=4.7,<5",
    "pandas>=3.0.5,<4",
    "pyarrow>=25.0.1,<26",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
